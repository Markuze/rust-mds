[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.99"

[workspace.dependencies]
denc = { path = "crates/denc" }
bytes = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crc32c = "0.6"
rand = "0.9"
hex = "0.4"

[profile.dev]
opt-level = 1

[profile.release]
debug = 1
